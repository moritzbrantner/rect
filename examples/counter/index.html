<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Rect is an experimental, modern-only React alternative focused on direct updates, small runtime semantics, and measurable performance."
    />
    <title>Rect — a small, direct UI runtime</title>
    <style>
      :root {
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color-scheme: light dark;
        font-synthesis: none;
        line-height: 1.5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(circle at top left, color-mix(in srgb, CanvasText 7%, transparent), transparent 34rem),
          Canvas;
        color: CanvasText;
      }

      a {
        color: inherit;
      }

      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }

      button:focus-visible,
      a:focus-visible {
        outline: 3px solid Highlight;
        outline-offset: 3px;
      }

      .shell {
        width: min(72rem, calc(100vw - 2rem));
        margin: 0 auto;
        padding: 4rem 0 5rem;
      }

      .hero {
        display: grid;
        gap: 1.5rem;
        max-width: 54rem;
      }

      .eyebrow,
      .section-label {
        margin: 0;
        font-size: 0.75rem;
        font-weight: 750;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        opacity: 0.68;
      }

      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }

      h1 {
        margin-bottom: 0;
        font-size: clamp(3rem, 9vw, 7.5rem);
        line-height: 0.88;
        letter-spacing: -0.07em;
      }

      h2 {
        font-size: clamp(1.7rem, 4vw, 2.6rem);
        letter-spacing: -0.035em;
      }

      .lede {
        max-width: 48rem;
        margin-bottom: 0;
        font-size: clamp(1.05rem, 2.2vw, 1.35rem);
        opacity: 0.78;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }

      .action {
        display: inline-flex;
        min-height: 2.75rem;
        align-items: center;
        justify-content: center;
        border: 1px solid color-mix(in srgb, CanvasText 22%, transparent);
        border-radius: 999px;
        padding: 0.65rem 1rem;
        text-decoration: none;
      }

      .action.primary {
        background: CanvasText;
        color: Canvas;
      }

      .demo,
      .principles,
      .status {
        margin-top: 4rem;
      }

      .demo-card {
        display: grid;
        gap: 1.25rem;
        border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
        border-radius: 1.5rem;
        padding: clamp(1.25rem, 4vw, 2rem);
        background: color-mix(in srgb, CanvasText 3%, Canvas);
      }

      .counter-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 1rem;
      }

      .counter-value {
        min-width: 6ch;
        margin: 0;
        font-variant-numeric: tabular-nums;
        font-size: clamp(2rem, 6vw, 4rem);
        font-weight: 760;
        letter-spacing: -0.05em;
      }

      button {
        min-height: 3rem;
        border: 1px solid color-mix(in srgb, CanvasText 24%, transparent);
        border-radius: 0.9rem;
        padding: 0.7rem 1rem;
        background: CanvasText;
        color: Canvas;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .note {
        max-width: 50rem;
        margin-bottom: 0;
        opacity: 0.72;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr));
        gap: 1rem;
      }

      .principle {
        min-height: 11rem;
        border-top: 1px solid color-mix(in srgb, CanvasText 24%, transparent);
        padding-top: 1rem;
      }

      .principle h3 {
        margin-bottom: 0.5rem;
      }

      .principle p {
        margin-bottom: 0;
        opacity: 0.72;
      }

      .status-line {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
      }

      .chip {
        border: 1px solid color-mix(in srgb, CanvasText 20%, transparent);
        border-radius: 999px;
        padding: 0.35rem 0.65rem;
        font-size: 0.85rem;
      }

      @media (max-width: 40rem) {
        .shell {
          width: min(100% - 1.25rem, 72rem);
          padding-top: 2.5rem;
        }
      }

      @media (prefers-reduced-motion: no-preference) {
        button {
          transition:
            transform 120ms ease,
            opacity 120ms ease;
        }

        button:active {
          transform: translateY(1px);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
