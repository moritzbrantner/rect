name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Prepare declared environment
        run: bash scripts/codex-environment.sh setup

      - name: Verify environment fingerprint
        uses: moritzbrantner/coding-tooling@4524918dc26ad9eec85df43c7c11fb08aca6d054
        with:
          operation: environment-verify
          bun-version: 1.4.0
          install-mode: none

      - name: Apply canonical formatting
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: bun run format

      - name: Commit canonical formatting
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src examples tests benchmarks package.json tsconfig.json .coding-tooling.json .coding-tooling.expectations.json renovate.json
          git commit -m "style: apply oxfmt"
          git push origin "HEAD:${HEAD_REF}"

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build Counter
        run: bun run build

      - name: Unit tests
        run: bun run test:unit

      - name: Run fast validation tier
        uses: moritzbrantner/coding-tooling@4524918dc26ad9eec85df43c7c11fb08aca6d054
        with:
          tier: fast
          bun-version: 1.4.0
          install-mode: none
