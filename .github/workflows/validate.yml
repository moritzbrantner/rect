name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Prepare declared environment
        run: bash scripts/codex-environment.sh setup

      - name: Verify environment fingerprint
        uses: moritzbrantner/coding-tooling@28307c66f40e6f02012ed06cc6a632b8b4b15434
        with:
          operation: environment-verify
          bun-version: 1.4.0
          install-mode: none

      - name: Run fast validation tier
        uses: moritzbrantner/coding-tooling@28307c66f40e6f02012ed06cc6a632b8b4b15434
        with:
          tier: fast
          bun-version: 1.4.0
          install-mode: none
