name: Generate Solid compiler lockfile

on:
  push:
    branches:
      - feat/solid-official-compiler
    paths:
      - "benchmarks/comparison/package.json"
      - ".github/workflows/generate-solid-lockfile.yml"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Update comparison lockfile
        run: |
          bun install
          if git diff --quiet -- bun.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "Update comparison lockfile"
          git push origin HEAD:feat/solid-official-compiler
