name: Apply region ownership refinement

on:
  push:
    branches:
      - feat/region-ownership-refinement
    paths:
      - .github/workflows/apply-region-ownership-refinement.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out refinement branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.ref_name }}

      - name: Apply ownership refinement
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, found {count}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "src/reactivity.ts",
              "export function getOwner(): ReactiveOwner | undefined {\n",
              "export function createRegionOwner(\n"
              "  parent: ReactiveOwner | undefined = activeOwner,\n"
              "): ReactiveOwner {\n"
              "  const owner = createOwner(parent);\n"
              "  parent?.children.delete(owner);\n"
              "  return owner;\n"
              "}\n\n"
              "export function getOwner(): ReactiveOwner | undefined {\n",
          )

          replace_once(
              "src/dom.ts",
              '''function disposeConditionalBranch(
  start: Comment,
  end: Comment,
  owner: ReactiveOwner | undefined,
): void {
  let firstError: unknown;
  let hasError = false;
  let node = start.nextSibling;

  while (node && node !== end) {
    const next = node.nextSibling;
    try {
      disposeTree(node);
    } catch (error) {
      if (!hasError) {
        firstError = error;
        hasError = true;
      }
    }
    node.parentNode?.removeChild(node);
    node = next;
  }

  if (owner) {
    try {
      disposeOwner(owner);
    } catch (error) {
      if (!hasError) {
        firstError = error;
        hasError = true;
      }
    }
  }

  if (hasError) throw firstError;
}
''',
              '''function disposeConditionalBranch(
  start: Comment,
  end: Comment,
  owner: ReactiveOwner | undefined,
): void {
  const detached = document.createDocumentFragment();
  let node = start.nextSibling;
  while (node && node !== end) {
    const next = node.nextSibling;
    detached.appendChild(node);
    node = next;
  }

  let firstError: unknown;
  let hasError = false;
  try {
    disposeDetachedTree(detached);
  } catch (error) {
    firstError = error;
    hasError = true;
  }
  detached.replaceChildren();

  if (owner) {
    try {
      disposeOwner(owner);
    } catch (error) {
      if (!hasError) {
        firstError = error;
        hasError = true;
      }
    }
  }

  if (hasError) throw firstError;
}
''',
          )

          replace_once(
              "src/dom.ts",
              '''    const fragment = document.createDocumentFragment();
    appendChild(fragment, child);
    const dispose = () => disposeOwner(owner);
    if (fragment.childNodes.length === 1) {
      const node = fragment.firstChild as Node;
      moveDisposers(fragment, node);
      registerDisposer(node, dispose);
      return node;
    }
    registerDisposer(fragment, dispose);
    return fragment;
''',
