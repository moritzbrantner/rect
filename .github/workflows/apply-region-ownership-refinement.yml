          import base64, zlib
          from pathlib import Path
          encoded = ''.join(Path('/tmp/patch.zb64').read_text().split())
          Path('/tmp/apply.py').write_bytes(zlib.decompress(base64.b64decode(encoded)))
          PY
          python /tmp/apply.py

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format refinement
        run: bun run format

      - name: Run focused repository gates
        run: |
          bun run test:unit
          bun run typecheck
          bun run lint
          bun run build

      - name: Remove one-shot workflow and verify diff
        run: |
          rm .github/workflows/apply-region-ownership-refinement.yml
          git diff --check

      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: refine region ownership"
          git push origin "HEAD:${GITHUB_REF_NAME}"
