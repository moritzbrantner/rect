    const lifetimeAnchor = document.createComment("rect:component:end");
    fragment.appendChild(lifetimeAnchor);
    moveDisposers(fragment, lifetimeAnchor);
    registerDisposer(lifetimeAnchor, dispose);
    return fragment;
