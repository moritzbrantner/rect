name: Environment v1

on:
  pull_request:
    paths:
      - ".repository-environment.toml"
      - "scripts/codex-environment.sh"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/environment-v1.yml"
  push:
    branches: [main]
    paths:
      - ".repository-environment.toml"
      - "scripts/codex-environment.sh"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/environment-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    permissions:
      contents: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/environment-v1-canary.yml@112330e4e04b6b990323705e4e3ee768c0742917
    with:
      bun_version: 1.4.0
