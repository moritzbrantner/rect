name: Foundation type-aware lint install

on:
  push:
    branches:
      - rollout/foundation-conventions-v1

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install pinned type-aware lint companion
        run: bun add --dev --exact oxlint-tsgolint@7.0.2001
      - name: Commit tooling state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json bun.lock
          git diff --cached --quiet && exit 0
          git commit -m "chore: add type-aware lint companion"
          git push origin HEAD
