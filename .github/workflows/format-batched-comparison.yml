name: Format batched comparison branch

on:
  push:
    branches:
      - perf/batched-multi-value
    paths:
      - ".github/workflows/format-batched-comparison.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Format repository sources
        run: |
          bun install --frozen-lockfile
          bun run format
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks examples
          git commit -m "Format batched comparison changes"
          git push origin HEAD:perf/batched-multi-value
