name: Foundation rollout

on:
  push:
    branches:
      - rollout/foundation-conventions-v1

permissions:
  contents: write

jobs:
  generate-conventions:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consumer
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Checkout coding-tooling
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: moritzbrantner/coding-tooling
          ref: dfd459a3f5d6858ae813dca9e1e8442c3dd0cc17
          path: .foundation-sources/coding-tooling
          persist-credentials: false

      - name: Checkout coding-agent-conventions
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: moritzbrantner/coding-agent-conventions
          ref: 8a6bd286b108a0be889073cc22698dd8add8c50b
          path: .foundation-sources/coding-agent-conventions
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Generate installed convention snapshot
        run: |
          bun .foundation-sources/coding-tooling/src/entry.ts conventions init \
            dependencies environment git typescript \
            --root "$GITHUB_WORKSPACE" \
            --conventions-root "$GITHUB_WORKSPACE/.foundation-sources/coding-agent-conventions" \
            --json
          rm -rf .foundation-sources

      - name: Commit generated artifacts
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add conventions.json conventions.lock.json .conventions
          git diff --cached --quiet && exit 0
          git commit -m "chore: install foundation conventions"
          git push origin HEAD
