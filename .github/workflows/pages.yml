name: Pages

on:
  push:
    branches: [main]
    paths:
      - "examples/performance-lab/**"
      - "src/**"
      - "scripts/build-pages.mjs"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "examples/performance-lab/**"
      - "src/**"
      - "scripts/build-pages.mjs"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Prepare declared environment
        run: bash scripts/codex-environment.sh setup

      - name: Capture canonical formatter patch
        if: github.event_name == 'pull_request'
        run: |
          bun run format
          printf 'FORMAT_PATCH_BASE64='
          git diff -- examples/performance-lab | base64 -w0
          printf '\n'

      - name: Build Pages performance lab
        run: bun run build:pages

      - name: Configure Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist/pages

  deploy:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
